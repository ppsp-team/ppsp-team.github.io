        intelligence, and clinical applications articulate. You will have worked in a pediatric university
        hospital, observed how research connects to the real needs of children and families.
        *Multidisciplinary culture*: You will be able to dialogue with neuroscience researchers, engineers,
        clinicians, and designers.
        
        ### Network & Trajectories
        You will work at CHU Sainte-Justine, with access to seminars and training from Montreal's AI
        ecosystem (Mila, IVADO). Depending on project progress, you may co-sign methodological
        publications.
        
        ### Concrete Portfolio
