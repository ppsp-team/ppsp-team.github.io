    our_mission:
      fr: |
        ## Notre Mission

        **Social NeuroAI Hub — Where minds connect**

        *Où les intelligences se rencontrent*

        Le **Laboratoire PPSP** est situé au **CHU Sainte-Justine**, l'un des plus grands hôpitaux pédiatriques universitaires au monde. Nous développons les sciences et technologies qui permettent de comprendre comment les diverses intelligences se coordonnent, se développent et s'entraident. Notre approche : l'**hyperscanning multimodal** enregistre simultanément cerveau, physiologie, langage et comportement de plusieurs personnes en interaction. L'objectif est d'explorer **les potentialités et diversités cognitives et méta-cognitives**. Nous créons des outils open-source, des protocoles cliniques et des connaissances qui, ensemble, servent directement les enfants, les familles et les soignants. **Du labo à l'hôpital, de la science à la santé.**
      en: |
        ## Our Mission

        **Social NeuroAI Hub — Where minds connect**

        *Où les intelligences se rencontrent*

        The **PPSP Laboratory** is located at **CHU Sainte-Justine**, one of the world's largest pediatric university hospitals. We develop the sciences and technologies that enable understanding of how diverse intelligences coordinate, develop, and support one another. Our approach: **multimodal hyperscanning** simultaneously records brain, physiology, language, and behavior of multiple people in interaction. Our goal is to explore **cognitive and meta-cognitive potentialities and diversities**. We create open-source tools, clinical protocols, and knowledge that together directly serve children, families, and healthcare providers. **From lab to hospital, from science to health.**

    your_mission:
      fr: |
        ## Votre Mission

        ### Une base de données ouverte pour l'hyperscanning

        L'hyperscanning enregistre l'activité cérébrale de plusieurs personnes pendant qu'elles interagissent. Les jeux de données publics sont encore peu nombreux, ce qui complique la comparaison des méthodes et la reproduction des résultats d'un laboratoire à l'autre. Votre mission : mener des acquisitions avec des casques EEG mobiles (Mentalab, Starstim) auprès de dyades engagées dans des tâches variées (jeu compétitif, jeu coopératif, méditation) et poser les fondations d'une base de données ouverte, documentée et réutilisable par la communauté scientifique.

        **Ce que vous allez faire :**

        **Acquisition :**
        - Préparer et conduire des séances d'hyperscanning en EEG mobile avec des dyades : installation des casques, vérification du signal, déroulé des tâches
        - Mettre en œuvre les tâches du protocole : jeu compétitif, jeu coopératif, méditation
        - Accueillir les participant·es, recueillir leur consentement et veiller à leur confort tout au long de la séance
        - Planifier les séances et tenir le journal d'acquisition

        **Qualité & Validation :**
        - Contrôler la qualité des enregistrements après chaque séance : signal, synchronisation entre les deux casques, marqueurs d'événements
        - Tester et affiner le protocole lors de séances pilotes
        - Consigner les incidents et proposer des améliorations du dispositif

        **Documentation & Open-Source :**
        - Organiser les données et leurs métadonnées selon le standard BIDS
        - Rédiger le protocole d'acquisition pas à pas, pour qu'une autre équipe puisse le reproduire
        - Préparer la documentation qui accompagnera la mise à disposition de la base

        **Recherche Appliquée :**
        - Réaliser de premières analyses de synchronie inter-cérébrale avec HyPyP pour vérifier que les données sont exploitables
        - Comparer les tâches entre elles et présenter les résultats en lab meeting
        - Contribuer au choix des prochaines tâches à intégrer à la base

        **Projets concrets :**

        - La base de données ouverte d'hyperscanning du laboratoire, dont vous réaliserez les acquisitions
        - HyPyP, la librairie open-source du laboratoire pour l'analyse de la synchronie inter-cérébrale, que vos données serviront à éprouver
        - Les deux stages menés en parallèle (hyperscanning en réalité virtuelle, neurofeedback dyadique), qui s'appuieront sur votre protocole d'acquisition

        **Impact :**

        Chaque séance que vous menez alimente une ressource que d'autres laboratoires pourront réutiliser pour développer et comparer leurs méthodes d'analyse de l'interaction humaine.
      en: |
        ## Your Mission

        ### An open database for hyperscanning

        Hyperscanning records the brain activity of several people while they interact. Public datasets are still few, which makes it hard to compare methods and to reproduce results from one lab to another. Your mission: run acquisitions with mobile EEG headsets (Mentalab, Starstim) on dyads engaged in a variety of tasks (competitive game, cooperative game, meditation) and lay the foundations of an open database, documented and reusable by the scientific community.

        **What you will do:**

        **Acquisition:**
        - Prepare and run mobile EEG hyperscanning sessions with dyads: headset setup, signal checks, task flow
        - Implement the protocol tasks: competitive game, cooperative game, meditation
        - Welcome participants, collect their consent, and look after their comfort throughout the session
        - Schedule sessions and keep the acquisition log

        **Quality & Validation:**
        - Check recording quality after each session: signal, synchronization between the two headsets, event markers
        - Test and refine the protocol during pilot sessions
        - Log incidents and propose improvements to the setup

        **Documentation & Open-Source:**
        - Organize data and metadata following the BIDS standard
        - Write the step-by-step acquisition protocol so that another team can reproduce it
        - Prepare the documentation that will accompany the release of the database

        **Applied Research:**
        - Run first inter-brain synchrony analyses with HyPyP to confirm the data are usable
        - Compare tasks with one another and present the results at lab meetings
        - Contribute to choosing the next tasks to add to the database

        **Concrete projects:**

        - The lab's open hyperscanning database, for which you will run the acquisitions
        - HyPyP, the lab's open-source library for inter-brain synchrony analysis, which your data will put to the test
        - The two internships running in parallel (hyperscanning in virtual reality, dyadic neurofeedback), which will build on your acquisition protocol

        **Impact:**

        Every session you run feeds a resource that other labs will be able to reuse to develop and compare their methods for analyzing human interaction.

