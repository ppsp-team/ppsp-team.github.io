    application:
      fr: |
        ## Procédure de Recrutement
        Notre processus est conçu pour être transparent, respectueux et équitable. L'objectif : trouver le bon fit
        mutuel.
        
        ### Documents Requis
        
        **Obligatoires :**
        - CV (2 pages maximum)
        - Relevé de notes (transcripts des 2 dernières années)
        - Lettre de motivation (1 page) : Pourquoi ce stage ? Pourquoi le PPSP ? Votre projet à 3-5 ans
        - Portfolio et/ou lien GitHub démontrant vos projets de visualisation de données
        
        **Complémentaires (recommandés) :**
        - 1 à 2 références (académiques ou professionnelles) : nom, fonction, email
        
        ### Processus de Sélection
        
        **Étape 1 : Présélection sur Dossier (7 jours)**
        Nous évaluons motivation et alignement, compétences techniques, potentiel de croissance, et fit avec le
        projet. Vous recevez une réponse dans les 7 jours ouvrés, même si votre candidature n'est pas retenue.
        
        **Étape 2 : Entretien Motivation (30 min)**
        Visioconférence ou présentiel (votre choix). Discussion ouverte sur votre parcours, vos motivations, votre
        projet de carrière. Ce que nous évaluons : alignement motivationnel, clarté du projet professionnel,
        capacité à communiquer.
        
        **Étape 3 : Entretien Technique (45 min)**
        Revue de portfolio commentée : vous présentez vos projets de visualisation. Discussion technique autour
        d'un cas concret du laboratoire (communiqué à l'avance) : comment visualiseriez-vous ces données ?
        
        **Étape 4 : Entretien de Départage (optionnel, 30 min)**
        Si plusieurs candidatures excellentes sont en balance.
        
        ### Nos engagements
        - Réponse initiale : 7 jours ouvrés après réception dossier complet
        - Décision finale : 48h après dernier entretien
        - Feedback constructif pour candidat·es reçu·es en entretien
        - Respect de votre temps (pas de ghosting, pas de délais excessifs)
        
        ## Comment Postuler
        * **Email** : apply@ppsp.team
        * **Objet** : "Candidature Stage Data Visualisation Wizard - [Votre Nom]"
        * **Format des documents** :
          - NomPrenom_CV.pdf
          - NomPrenom_ReleveNotes.pdf
          - NomPrenom_LettreMotivation.pdf
        * **Dans le corps de l'email** : Lien vers portfolio/GitHub, période de disponibilité souhaitée, questions
        éventuelles.
        * **Questions ?** Écrivez-nous. Nous répondons à toutes les questions.
      en: |
        ## Recruitment Process
        Our process is designed to be transparent, respectful, and fair. The goal: find the right mutual fit.
        
        ### Required Documents
        
        **Mandatory:**
        - CV (2 pages maximum)
        - Transcripts (last 2 years)
        - Cover letter (1 page): Why this internship? Why PPSP? Your 3-5 year plan
        - Portfolio and/or GitHub link demonstrating your data visualization projects
        
        **Complementary (recommended):**
        - 1 to 2 references (academic or professional): name, title, email
        
        ### Selection Process
        
        **Step 1: Application Screening (7 days)**
        We evaluate motivation and alignment, technical skills, growth potential, and project fit. You receive a
        response within 7 business days, even if your application is not selected.
        
        **Step 2: Motivation Interview (30 min)**
        Video conference or in-person (your choice). Open discussion about your background, motivations, career
        plan. What we evaluate: motivational alignment, career plan clarity, communication ability.
        
        **Step 3: Technical Interview (45 min)**
        Commented portfolio review: you present your visualization projects. Technical discussion around a
        concrete lab case (communicated in advance): how would you visualize this data?
        
        **Step 4: Tie-Breaking Interview (optional, 30 min)**
        If several excellent applications are balanced.
        
        ### Our Commitments
        - Initial response: 7 business days after complete application received
        - Final decision: 48 hours after last interview
        - Constructive feedback for candidates interviewed
        - Respect for your time (no ghosting, no excessive delays)
        
        ## How to Apply
        * **Email**: apply@ppsp.team
        * **Subject**: "Application Data Visualisation Wizard Internship - [Your Name]"
        * **Document format**:
          - LastnameFirstname_CV.pdf
          - LastnameFirstname_Transcripts.pdf
          - LastnameFirstname_CoverLetter.pdf
        * **In the email body**: Link to portfolio/GitHub, desired availability period, any questions.
        * **Questions?** Write to us. We respond to all questions.

    contact: "apply@ppsp.team"
