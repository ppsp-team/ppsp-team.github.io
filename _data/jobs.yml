    our_mission:
      fr: |
        ## Notre Mission

        **Social NeuroAI Hub — Where minds connect**

        *Où les intelligences se rencontrent*

        Le **Laboratoire PPSP** est situé au **CHU Sainte-Justine**, l'un des plus grands hôpitaux pédiatriques universitaires au monde. Nous développons les sciences et technologies qui permettent de comprendre comment les diverses intelligences se coordonnent, se développent et s'entraident. Notre approche : l'**hyperscanning multimodal** enregistre simultanément cerveau, physiologie, langage et comportement de plusieurs personnes en interaction. L'objectif est d'explorer **les potentialités et diversités cognitives et méta-cognitives**. Nous créons des outils open-source, des protocoles cliniques et des connaissances qui, ensemble, servent directement les enfants, les familles et les soignants. **Du labo à l'hôpital, de la science à la santé.**
      en: |
        ## Our Mission

        **Social NeuroAI Hub — Where minds connect**

        *Où les intelligences se rencontrent*

        The **PPSP Laboratory** is located at **CHU Sainte-Justine**, one of the world's largest pediatric university hospitals. We develop the sciences and technologies that enable understanding of how diverse intelligences coordinate, develop, and support one another. Our approach: **multimodal hyperscanning** simultaneously records brain, physiology, language, and behavior of multiple people in interaction. Our goal is to explore **cognitive and meta-cognitive potentialities and diversities**. We create open-source tools, clinical protocols, and knowledge that together directly serve children, families, and healthcare providers. **From lab to hospital, from science to health.**

    your_mission:
      fr: |
        ## Votre Mission

        ### Fermer la boucle entre deux cerveaux

        Le neurofeedback présente à une personne son activité cérébrale en temps réel pour qu'elle apprenne à la moduler. En version dyadique, le retour porte sur ce qui se passe entre deux cerveaux, par exemple leur degré de synchronie. Votre mission : piloter le développement et l'évaluation d'une boucle de neurofeedback dyadique à partir des casques EEG mobiles du laboratoire (Mentalab, Starstim), depuis le calcul des mesures en temps réel jusqu'au retour présenté aux deux participant·es. Vous menez ce chantier, et nous y travaillons avec vous.

        **Ce que vous allez faire :**

        **Développement :**
        - Construire avec l'équipe le traitement en temps réel de deux flux EEG : filtrage, gestion des artefacts, extraction de caractéristiques
        - Choisir avec l'équipe scientifique les mesures de synchronie inter-cérébrale à calculer en ligne, en s'appuyant sur les métriques de HyPyP
        - Concevoir le retour présenté à la dyade (visuel, sonore) et en proposer plusieurs variantes à comparer

        **Validation & Tests :**
        - Caractériser la latence de la boucle de bout en bout
        - Vérifier la justesse des mesures en ligne en les comparant aux analyses hors ligne
        - Tester la boucle sur des signaux simulés, puis lors de séances pilotes

        **Documentation & Open-Source :**
        - Documenter la boucle et ses paramètres
        - Contribuer à la publication du code en open-source, avec des exemples reproductibles
        - Rédiger le protocole de séance à destination de l'équipe d'acquisition

        **Recherche Appliquée :**
        - Participer aux acquisitions EEG en neurofeedback dyadique
        - Contribuer au design expérimental : conditions contrôle, choix des mesures renvoyées aux participant·es
        - Analyser les premières données et les présenter en lab meeting

        **Projets concrets :**

        - La boucle de neurofeedback dyadique du laboratoire, dont vous piloterez le développement avec l'équipe
        - HyPyP, la librairie open-source du laboratoire, dont les mesures de synchronie alimenteront le calcul en temps réel
        - La base de données ouverte d'hyperscanning et le dispositif AR/VR, avec lesquels votre boucle partagera protocole d'acquisition et environnements

        **Impact :**

        Votre boucle ouvrira à l'équipe un nouveau type d'expérience, où deux personnes apprennent ensemble à moduler leur synchronie.
      en: |
        ## Your Mission

        ### Closing the loop between two brains

        Neurofeedback shows a person their brain activity in real time so they can learn to modulate it. In its dyadic form, the feedback reflects what happens between two brains, for example their degree of synchrony. Your mission: lead the development and evaluation of a dyadic neurofeedback loop built on the lab's mobile EEG headsets (Mentalab, Starstim), from real-time computation of the measures to the feedback presented to both participants. You lead this effort, and we work on it with you.

        **What you will do:**

        **Development:**
        - Build with the team the real-time processing of two EEG streams: filtering, artifact handling, feature extraction
        - Choose with the scientific team the inter-brain synchrony measures to compute online, building on HyPyP metrics
        - Design the feedback presented to the dyad (visual, auditory) and propose several variants to compare

        **Validation & Testing:**
        - Characterize the end-to-end latency of the loop
        - Check the accuracy of online measures by comparing them with offline analyses
        - Test the loop on simulated signals, then during pilot sessions

        **Documentation & Open-Source:**
        - Document the loop and its parameters
        - Contribute to releasing the code as open-source, with reproducible examples
        - Write the session protocol for the acquisition team

        **Applied Research:**
        - Take part in EEG acquisitions with dyadic neurofeedback
        - Contribute to the experimental design: control conditions, choice of measures fed back to participants
        - Analyze the first data and present them at lab meetings

        **Concrete projects:**

        - The lab's dyadic neurofeedback loop, whose development you will lead with the team
        - HyPyP, the lab's open-source library, whose synchrony measures will feed the real-time computation
        - The open hyperscanning database and the AR/VR setup, with which your loop will share acquisition protocol and environments

        **Impact:**

        Your loop will open a new kind of experiment for the team, where two people learn together to modulate their synchrony.

