    process:
      fr: |
        ** Procédure de Recrutement **
        
        Notre processus est conçu pour être transparent, respectueux et équitable. L'objectif : trouver le bon fit
        mutuel.
        
        **Documents requis**
        
        *Obligatoires :*
        - CV (2 pages maximum)
        - Relevé de notes (transcripts des 2 dernières années)
        - Lettre de motivation (1 page) : Pourquoi ce stage précis ? Pourquoi le laboratoire PPSP ? Votre projet de
        carrière à 3-5 ans
        
        *Complémentaires (recommandés) :*
        - 1 à 2 références (académiques ou professionnelles) : nom, fonction, email
        - Exemple de travail universitaire (rapport, mémoire, projet collectif)
        
        **Processus de sélection**
        
        *Étape 1 : Présélection sur dossier (7 jours)
        Nous évaluons votre candidature selon : motivation et alignement, compétences techniques, potentiel de
        croissance, fit avec le projet. Vous recevez une réponse dans les 7 jours ouvrés.
        
        *Étape 2 : Entretien motivation (30 min)
        Visioconférence ou présentiel (votre choix). Discussion ouverte sur votre parcours, vos motivations, votre projet
        de carrière et vos questions sur le stage.
        
        *Étape 3 : Entretien technique (45 min)
        Discussion méthodologique pour évaluer votre curiosité intellectuelle et votre rigueur méthodologique. Nous
        explorerons vos connaissances et votre approche de la recherche.
        
        *Étape 4 : Entretien de départage (optionnel, 30 min)
        Si plusieurs candidatures excellentes sont en balance.
        
        **Timeline & engagements**

        Réponse initiale : 7 jours ouvrés | Entretiens : planifiés sur 2-3 semaines | Décision finale : 48h après dernier
        entretien
        
        Nos engagements : réponse systématique à toute candidature complète, transparence sur critères et timeline,
        feedback constructif pour candidat·es reçu·es en entretien, respect de votre temps, équité pour tou·tes.
      
      en: |
        **Recruitment Process**
        
        Our process is designed to be transparent, respectful, and fair. The goal: find the right mutual fit.
        
        **Required Documents**
        
        *Mandatory:*
        - CV (2 pages maximum)
        - Transcripts (last 2 years)
        - Cover letter (1 page): Why this specific internship? Why the PPSP laboratory? Your career plan for the
        next 3-5 years
        
        *Complementary (recommended):*
        - 1 to 2 references (academic or professional): name, title, email
        - Example of academic work (report, thesis, group project)
        
        *Selection Process*
        
        * Step 1: Application Screening (7 days)

        We evaluate your application on: motivation and alignment, technical skills, growth potential, project fit. You
        receive a response within 7 business days.
        
        * Step 2: Motivation Interview (30 min)

        Video conference or in-person (your choice). Open discussion about your background, motivations, career plan,
        and questions about the internship.
        
        * Step 3: Technical Interview (45 min)

        Methodological discussion to evaluate your intellectual curiosity and methodological rigor. We will explore your
        knowledge and approach to research.

        * Step 4: Tie-Breaking Interview (optional, 30 min)
        If several excellent applications are balanced.
        
        **Timeline & Commitments**

        - Initial response: 7 business days | Interviews: scheduled over 2-3 weeks | Final decision: 48 hours after last
        interview
        - Our commitments: systematic response to every complete application, transparency on criteria and timeline,
        constructive feedback for interviewed candidates, respect for your time, equity for everyone.

