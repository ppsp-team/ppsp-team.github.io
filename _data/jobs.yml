    our_mission:
      fr: |
        ## Notre Mission
        Social NeuroAI Hub — Where minds connect
        Où les intelligences se rencontrent
        Le Laboratoire PPSP est situé au CHU Sainte-Justine, l'un des plus grands hôpitaux pédiatriques
        universitaires au monde. Nous développons les sciences et technologies qui permettent de comprendre
        comment les diverses intelligences se coordonnent, se développent et s'entraident. Notre approche :
        l'hyperscanning multimodal enregistre simultanément cerveau, physiologie, langage et comportement de
        plusieurs personnes en interaction. L'objectif est d'explorer les potentialités et diversités cognitives et
        méta-cognitives. Nous créons des outils open-source, des protocoles cliniques et des connaissances qui,
        ensemble, servent directement les enfants, les familles et les soignants. Du labo à l'hôpital, de la science à la
        santé.
      en: |
        ## Our Mission
        **Social NeuroAI Hub — Where minds connect**
        **Où les intelligences se rencontrent**
        The **PPSP Laboratory** is located at **CHU Sainte-Justine**, one of the world's largest pediatric university
        hospitals. We develop the sciences and technologies that enable understanding of how diverse
        intelligences coordinate, develop, and support one another. Our approach: **multimodal hyperscanning**
        simultaneously records brain, physiology, language, and behavior of multiple people in interaction. Our
        goal is to explore **cognitive and meta-cognitive potentialities and diversities**. We create open-source
        tools, clinical protocols, and knowledge that together directly serve children, families, and healthcare
        providers. **From lab to hospital, from science to health**.
    your_mission:
      fr: |
        ## Votre Mission
        Vous rejoindrez le projet «Computational approaches to the phenomenology of togetherness in autism
        and non-autism». Votre mission : analyser l'expérience vécue de l'interaction sociale chez les personnes
        autistes et non-autistes, à travers des entretiens phénoménologiques et des cartes corporelles.

        **Ce que vous allez faire :**

        ### Transcription & Préparation des données
        - Transcrire les entretiens phénoménologiques
        - Préparer et organiser les données pour l'analyse
        - Assurer la qualité et la fidélité des transcriptions

        ### Codage & Analyse
        - Coder les entretiens avec Atlas.ti et logiciels open source
        - Réaliser des analyses thématiques / IPA (Interpretative Phenomenological Analysis)
        - Analyser les cartes corporelles

        ### Documentation & Méthodologie
        - Documenter les procédures de codage
        - Contribuer à l'élaboration de guides méthodologiques
        - Participer aux discussions d'équipe sur l'analyse
        
        **Impact :**
        Contribuer à mieux comprendre le vécu de l'interaction sociale chez les personnes autistes.
      en: |
        ## Your Mission
        You will join the project **«Computational approaches to the phenomenology of togetherness in autism and non-autism»**. Your mission: analyze the lived experience of social interaction in autistic and non-autistic individuals, through phenomenological interviews and body maps.
        
        **What you will do:**
        
        ### Transcription & Data Preparation
        - Transcribe phenomenological interviews
        - Prepare and organize data for analysis
        - Ensure quality and accuracy of transcriptions
        
        ### Coding & Analysis
        - Code interviews using Atlas.ti and open source software
        - Conduct thematic analysis / IPA (Interpretative Phenomenological Analysis)
        - Analyze body maps
        
        ### Documentation & Methodology
        - Document coding procedures
        - Contribute to methodological guides development
        - Participate in team discussions on analysis
        
        **Impact:**
        Contribute to better understanding the lived experience of social interaction in autistic individuals.
    profile:
      fr: |
        ## Profil Recherché
        **Ce qui vous anime**

        Vous êtes attiré·e par l'exécution concrète, robuste, durable.
        - **Orientation résultats** : Vous trouvez satisfaction dans le travail qui aboutit, les objectifs atteints, la
        documentation qui éclaire.
        - **Curiosité intellectuelle** : Vous voulez comprendre pourquoi on mène ces projets, comment ils s'inscrivent
        dans la recherche.
        - **Rigueur méthodologique** : Vous travaillez de façon structurée, documentez vos démarches, validez vos
        résultats.
        - **Esprit collaboratif** : Vous appréciez les retours, partagez vos réflexions, accueillez les feedbacks.
        - **Autonomie** : Face à un problème, vous décomposez, explorez, testez des hypothèses.

        **Formation**
        Étudiant·e en psychologie, neuropsychologie, sciences cognitives, sociologie, anthropologie, philosophie ou
        discipline connexe.
        
        **Compétences requises**
        - Maîtrise du français (obligatoire — entretiens et analyses en français)
        - Rigueur et attention aux détails (obligatoire)
        
        **Atouts valorisés (non obligatoires)**
        - Expérience en analyse qualitative
        - Connaissance des méthodes phénoménologiques (IPA, etc.)
        - Maîtrise d'un logiciel de codage (Atlas.ti, NVivo, etc.)
        - Expérience en transcription d'entretiens
        - Connaissances sur l'autisme / neurodiversité
        - Maîtrise de l'anglais
      en: |
        ## Profile
        
        ### What drives you
        
        You are drawn to **concrete, robust, lasting execution.**
        - **Results-oriented**: You find satisfaction in work that delivers, goals achieved, documentation that clarifies.
        - **Intellectual curiosity**: You want to understand why we pursue these projects, how they fit into research.
        - **Methodological rigor**: You work in a structured way, document your approaches, validate your results.
        - **Collaborative spirit**: You appreciate feedback, share your reflections, welcome input.
        - **Autonomy**: Faced with a problem, you break it down, explore, test hypotheses.
        
        ### Education
        Student in psychology, neuropsychology, cognitive science, sociology, anthropology, philosophy or related discipline.
        
        ### Required skills
        - **French fluency (mandatory — interviews and analyses in French)**
        - Rigor and attention to detail (mandatory)
        
        ### Valued assets (not mandatory)
        - Experience in qualitative analysis
        - Knowledge of phenomenological methods (IPA, etc.)
        - Proficiency in coding software (Atlas.ti, NVivo, etc.)
        - Experience in interview transcription
        - Knowledge of autism / neurodiversity
        - English proficiency
    skills:
