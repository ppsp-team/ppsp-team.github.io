    application:
      fr: |
        ## Procédure de Recrutement

        Notre processus est conçu pour être **transparent, respectueux et équitable**. L'objectif : trouver le bon fit mutuel.

        **Documents Requis**

        Envoyez par email les documents suivants :

        *Obligatoires :*
        - CV (2 pages maximum)
        - Relevé de notes (transcripts des 2 dernières années)
        - Lettre de motivation (1 page) :
            - Pourquoi ce stage précis ?
            - Pourquoi le laboratoire PPSP ?
            - Votre projet de carrière à 3-5 ans

        *Complémentaires (recommandés) :*
        - 1 à 2 références (académiques ou professionnelles) : nom, fonction, email
        - Tout projet personnel ou universitaire en lien avec la technologie (code, création 3D, électronique, analyse de données), même modeste

        **Processus de Sélection**

        **Étape 1 : Présélection sur Dossier (7 jours)**

        Nous évaluons votre candidature selon quatre dimensions :

        1. **Motivation et alignement** : Votre lettre révèle-t-elle une compréhension de notre mission ?
        2. **Compétences techniques** : Votre parcours démontre-t-il les fondamentaux requis ?
        3. **Potentiel de croissance** : Trajectoire cohérente, projets personnels, curiosité intellectuelle
        4. **Fit avec le projet** : Vos intérêts correspondent-ils aux missions du stage ?

        *Engagement :* Vous recevez une réponse dans les **7 jours ouvrés**, même si votre candidature n'est pas retenue pour un entretien.

        **Étape 2 : Entretien Motivation (30 min)**

        *Visioconférence ou présentiel (votre choix)*

        Format : Discussion ouverte pour mieux vous connaître.

        *Vous parlez de vous (15 min) :*
        - Votre parcours et ce qui vous a amené ici
        - Vos motivations pour ce stage
        - Votre projet de carrière
        - Vos questions sur le stage et le laboratoire

        *Nous parlons du stage (10 min) :*
        - Mission détaillée et projets concrets
        - Environnement de travail et dynamique d'équipe
        - Attentes mutuelles

        *Discussion ouverte (5 min) :*
        - Vos questions (encouragées)
        - Clarifications pratiques

        Ce que nous évaluons : Alignement motivationnel, clarté du projet professionnel, capacité à communiquer, questions pertinentes.

        Ce que nous n'évaluons pas ici : Compétences techniques (réservées pour l'étape suivante).

        **Étape 3 : Entretien Technique (45 min)**

        *Visioconférence ou présentiel (votre choix)*

        Format : Discussion, puis étude de cas. Aucune préparation requise.

        *Votre rapport à la technologie (15 min) :*
        - Un projet, un outil ou un apprentissage technique dont vous êtes fier·ère, même modeste
        - Ce que vous aimeriez apprendre pendant le stage

        *Étude de cas (25 min) :*
        - Nous esquissons ensemble une séance de neurofeedback à deux : que renvoyer aux participant·es, sous quelle forme, avec quelle condition contrôle
        - Ce qui pourrait fausser la mesure et comment s'en prémunir

        *Vos questions (5 min)*

        Ce que nous évaluons : Curiosité, raisonnement expérimental, envie d'apprendre, clarté des explications.

        Ce que nous n'évaluons pas ici : Vos compétences en programmation et en traitement du signal, qui se construisent pendant le stage.

        **Étape 4 : Entretien de Départage (Optionnel, 30 min)**

        Si plusieurs candidatures excellentes sont en balance, un entretien court peut être organisé pour approfondir certains aspects ou discuter de scénarios de collaboration spécifiques.

        **Timeline & Engagements**

        *Timeline indicative :*
        - Réponse initiale : **7 jours ouvrés** après réception dossier complet
        - Entretiens : planifiés sur 2-3 semaines
        - Décision finale : **48h** après dernier entretien

        *Nos engagements :*
        - Réponse systématique à toute candidature complète
        - Transparence sur critères et timeline
        - Feedback constructif pour candidat·es reçu·es en entretien
        - Respect de votre temps (pas de ghosting, pas de délais excessifs)
        - Équité : mêmes critères pour tou·tes

        Nous traitons nos candidat·es comme des collaborateur·rices potentiel·les dès le premier contact.

        ## Comment Postuler

        **Email :** apply@ppsp.team

        **Objet :** "Candidature Stage Neurofeedback - [Votre Nom]"

        **Format des documents :**

        Envoyez tous les documents au format PDF, nommés comme suit :
        - `NomPrenom_CV.pdf`
        - `NomPrenom_RelevéNotes.pdf`
        - `NomPrenom_LettreMotivation.pdf`

        **Dans le corps de l'email :**
        - Période de disponibilité souhaitée
        - Questions éventuelles

        **Questions ?**

        Écrivez-nous. Nous répondons à toutes les questions.
      en: |
        ## Recruitment Process

        Our process is designed to be **transparent, respectful, and fair**. The goal: find the right mutual fit.

        **Required Documents**

        Send the following documents by email:

        *Mandatory:*
        - CV (2 pages maximum)
        - Transcripts (last 2 years)
        - Cover letter (1 page):
            - Why this specific internship?
            - Why the PPSP laboratory?
            - Your career plan for the next 3-5 years

        *Complementary (recommended):*
        - 1 to 2 references (academic or professional): name, title, email
        - Any personal or academic project involving technology (code, 3D creation, electronics, data analysis), however modest

        **Selection Process**

        **Step 1: Application Screening (7 days)**

        We evaluate your application across four dimensions:

        1. **Motivation and alignment**: Does your letter reveal understanding of our mission?
        2. **Technical skills**: Does your background demonstrate the required fundamentals?
        3. **Growth potential**: Coherent trajectory, personal projects, intellectual curiosity
        4. **Project fit**: Do your interests match the internship missions?

        *Commitment:* You receive a response within **7 business days**, even if your application is not selected for an interview.

        **Step 2: Motivation Interview (30 min)**

        *Video conference or in-person (your choice)*

        Format: Open discussion to get to know you better.

        *You talk about yourself (15 min):*
        - Your background and what brought you here
        - Your motivations for this internship
        - Your career plan
        - Your questions about the internship and laboratory

        *We talk about the internship (10 min):*
        - Detailed mission and concrete projects
        - Work environment and team dynamics
        - Mutual expectations

        *Open discussion (5 min):*
        - Your questions (encouraged)
        - Practical clarifications

        What we evaluate: Motivational alignment, career plan clarity, communication ability, relevant questions.

        What we don't evaluate here: Technical skills (reserved for the next stage).

        **Step 3: Technical Interview (45 min)**

        *Video conference or in-person (your choice)*

        Format: Discussion, then a case study. No preparation required.

        *You and technology (15 min):*
        - A project, tool, or technical skill you are proud of, however modest
        - What you would like to learn during the internship

        *Case study (25 min):*
        - Together we sketch a two-person neurofeedback session: what to feed back to participants, in what form, with which control condition
        - What could distort the measurement and how to guard against it

        *Your questions (5 min)*

        What we evaluate: Curiosity, experimental reasoning, eagerness to learn, clarity of explanations.

        What we don't evaluate here: Your programming and signal processing skills, which you will build during the internship.

        **Step 4: Tie-Breaking Interview (Optional, 30 min)**

        If several excellent applications are balanced, a short interview may be organized to deepen certain aspects or discuss specific collaboration scenarios.

        **Timeline & Commitments**

        *Indicative timeline:*
        - Initial response: **7 business days** after complete application received
        - Interviews: scheduled over 2-3 weeks
        - Final decision: **48 hours** after last interview

        *Our commitments:*
        - Systematic response to every complete application
        - Transparency on criteria and timeline
        - Constructive feedback for candidates interviewed
        - Respect for your time (no ghosting, no excessive delays)
        - Equity: same criteria for everyone

        We treat our candidates as potential collaborators from the first contact.

        ## How to Apply

        **Email:** apply@ppsp.team

        **Subject:** "Application Neurofeedback Internship - [Your Name]"

        **Document format:**

        Send all documents in PDF format, named as follows:
        - `LastnameFirstname_CV.pdf`
        - `LastnameFirstname_Transcripts.pdf`
        - `LastnameFirstname_CoverLetter.pdf`

        **In the email body:**
        - Desired availability period
        - Any questions

        **Questions?**

        Write to us. We respond to all questions.

