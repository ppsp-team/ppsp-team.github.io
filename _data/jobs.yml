    our_mission:
      fr: |
        ## Notre Mission

        **Social NeuroAI Hub — Where minds connect**

        *Où les intelligences se rencontrent*

        Le **Laboratoire PPSP** est situé au **CHU Sainte-Justine**, l'un des plus grands hôpitaux pédiatriques universitaires au monde. Nous développons les sciences et technologies qui permettent de comprendre comment les diverses intelligences se coordonnent, se développent et s'entraident. Notre approche : l'**hyperscanning multimodal** enregistre simultanément cerveau, physiologie, langage et comportement de plusieurs personnes en interaction. L'objectif est d'explorer **les potentialités et diversités cognitives et méta-cognitives**. Nous créons des outils open-source, des protocoles cliniques et des connaissances qui, ensemble, servent directement les enfants, les familles et les soignants. **Du labo à l'hôpital, de la science à la santé.**
      en: |
        ## Our Mission

        **Social NeuroAI Hub — Where minds connect**

        *Où les intelligences se rencontrent*

        The **PPSP Laboratory** is located at **CHU Sainte-Justine**, one of the world's largest pediatric university hospitals. We develop the sciences and technologies that enable understanding of how diverse intelligences coordinate, develop, and support one another. Our approach: **multimodal hyperscanning** simultaneously records brain, physiology, language, and behavior of multiple people in interaction. Our goal is to explore **cognitive and meta-cognitive potentialities and diversities**. We create open-source tools, clinical protocols, and knowledge that together directly serve children, families, and healthcare providers. **From lab to hospital, from science to health.**

    your_mission:
      fr: |
        ## Votre Mission

        ### Deux joueurs, deux cerveaux, un monde virtuel

        La réalité virtuelle permet de régler finement une situation d'interaction : ce que chaque personne voit, avec ou contre qui elle joue, dans quel environnement. Votre mission : intégrer, avec l'équipe, la réalité virtuelle et augmentée (Meta Quest 3, Apple Vision Pro) au dispositif d'hyperscanning EEG du laboratoire et concevoir des jeux déclinés en plusieurs configurations, pour étudier comment la situation d'interaction module la synchronie entre les cerveaux.

        **Ce que vous allez faire :**

        **Conception & Développement :**
        - Concevoir des scènes de jeu à deux et leurs configurations (par exemple coopération et compétition) à partir des questions de recherche
        - Les prototyper sur Meta Quest 3 et Apple Vision Pro avec l'ingénieur de recherche (Unity, visionOS natif), en vous formant aux outils au fil du stage
        - Synchroniser les événements du jeu avec les enregistrements EEG des deux participant·es
        - Rendre les configurations paramétrables pour que l'équipe puisse lancer une séance sans toucher au code
        - Explorer ce qu'apporte la réalité augmentée pour des interactions en co-présence

        **Validation & Tests :**
        - Mesurer les latences entre le casque, le jeu et les marqueurs EEG, et chercher à les réduire
        - Évaluer la cohabitation du casque immersif et du casque EEG : confort, artefacts de mouvement
        - Mener des séances pilotes avec l'équipe d'acquisition et ajuster l'expérience à partir des retours des participant·es

        **Documentation & Open-Source :**
        - Documenter l'installation et l'utilisation de chaque scène
        - Contribuer à la publication du code en open-source, avec des exemples prêts à lancer
        - Rédiger un guide pour ajouter une nouvelle scène au dispositif

        **Recherche Appliquée :**
        - Participer aux acquisitions d'hyperscanning en réalité virtuelle
        - Contribuer à la définition des configurations expérimentales avec l'équipe scientifique
        - Présenter vos prototypes et vos résultats en lab meeting

        **Projets concrets :**

        - Le dispositif d'hyperscanning en AR/VR du laboratoire, dont vous concevrez et prototyperez les scènes de jeu
        - La base de données ouverte d'hyperscanning, que vos tâches en réalité virtuelle viendront enrichir
        - Le stage de neurofeedback dyadique, qui pourra s'appuyer sur vos environnements pour présenter le retour aux participant·es

        **Impact :**

        Vos environnements donneront à l'équipe un terrain d'expérimentation où chaque paramètre de l'interaction se règle et se rejoue à l'identique.
      en: |
        ## Your Mission

        ### Two players, two brains, one virtual world

        Virtual reality makes it possible to fine-tune an interaction: what each person sees, who they play with or against, in which environment. Your mission: integrate, together with the team, virtual and augmented reality (Meta Quest 3, Apple Vision Pro) into the lab's EEG hyperscanning setup and design games available in several configurations, to study how the interaction setting modulates synchrony between brains.

        **What you will do:**

        **Design & Development:**
        - Design two-player game scenes and their configurations (for example cooperation and competition) from the research questions
        - Prototype them on Meta Quest 3 and Apple Vision Pro with the research engineer (Unity, native visionOS), learning the tools as the internship progresses
        - Synchronize game events with the EEG recordings of both participants
        - Make configurations parameterizable so the team can launch a session without touching the code
        - Explore what augmented reality brings to co-present interactions

        **Validation & Testing:**
        - Measure latencies between the headset, the game, and the EEG markers, and look for ways to reduce them
        - Assess how the immersive headset and the EEG headset work together: comfort, movement artifacts
        - Run pilot sessions with the acquisition team and adjust the experience based on participant feedback

        **Documentation & Open-Source:**
        - Document the installation and use of each scene
        - Contribute to releasing the code as open-source, with ready-to-run examples
        - Write a guide for adding a new scene to the setup

        **Applied Research:**
        - Take part in virtual reality hyperscanning acquisitions
        - Contribute to defining the experimental configurations with the scientific team
        - Present your prototypes and results at lab meetings

        **Concrete projects:**

        - The lab's AR/VR hyperscanning setup, for which you will design and prototype the game scenes
        - The open hyperscanning database, which your virtual reality tasks will enrich
        - The dyadic neurofeedback internship, which may build on your environments to present feedback to participants

        **Impact:**

        Your environments will give the team an experimental ground where every parameter of the interaction can be set and replayed identically.

