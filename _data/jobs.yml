  - id: python-hypyp
    active: false
    type: internship
    title:
      fr: "Développeur·se Python pour la librairie HyPyP"
      en: "Python Developer for the HyPyP Library"
    subtitle:
      fr: "HyPyP : développement de métriques et visualisations"
      en: "HyPyP: Metrics Development and Visualizations"
    location:
      fr: "CHU Sainte-Justine, Montréal"
      en: "CHU Sainte-Justine, Montreal"
    duration:
      fr: "12 à 20 semaines (3 à 5 mois)"
      en: "12 to 20 weeks (3 to 5 months)"
    start:
      fr: "Été 2026 (à partir de mai)"
      en: "Summer 2026 (from May)"
    onsite:
      fr: "3 jours/semaine minimum"
      en: "3 days/week minimum"
    
    our_mission:
      fr: |
        ## Notre Mission
        **Social NeuroAI Hub — Where minds connect**
        **Où les intelligences se rencontrent**
        Le **Laboratoire PPSP** est situé au **CHU Sainte-Justine**, l'un des plus grands hôpitaux pédiatriques
        universitaires au monde. Nous développons les sciences et technologies qui permettent de comprendre
        comment les diverses intelligences se coordonnent, se développent et s'entraident. Notre approche :
        l'**hyperscanning multimodal** enregistre simultanément cerveau, physiologie, langage et comportement
        de plusieurs personnes en interaction. L'objectif est d'explorer les **potentialités et diversités cognitives
        et méta-cognitives**. Nous créons des outils open-source, des protocoles cliniques et des connaissances
        qui, ensemble, servent directement les enfants, les familles et les soignants. **Du labo à l'hôpital, de la
        science à la santé**.
      en: |
        ## Our Mission
        **Social NeuroAI Hub — Where minds connect**
        **Où les intelligences se rencontrent**
        The **PPSP Laboratory** is located at **CHU Sainte-Justine**, one of the world's largest pediatric university
        hospitals. We develop the sciences and technologies that enable understanding of how diverse
        intelligences coordinate, develop, and support one another. Our approach: **multimodal hyperscanning**
        simultaneously records brain, physiology, language, and behavior of multiple people in interaction. Our
        goal is to explore **cognitive and meta-cognitive potentialities and diversities**. We create open-source
        tools, clinical protocols, and knowledge that together directly serve children, families, and healthcare
        providers. **From lab to hospital, from science to health**.

    your_mission:
      fr: |
        ## Votre Mission
        **HyPyP** est la librairie Python de référence pour analyser la synchronie inter-cerveau en hyperscanning.
        Votre mission : étendre les capacités d'analyse des dynamiques de synchronisation en développant
        de nouvelles métriques et des outils de visualisation.

        **Ce que vous allez faire :**

        ### Développement
        - Implémenter de nouvelles métriques de synchronie
        - Créer des modules de visualisation interactifs
        - Optimiser les performances des pipelines existants
        - Assurer un code robuste avec tests et benchmarks des méthodes

        ### Validation & Tests
        - Rédiger des tests unitaires et d'intégration
        - Valider les métriques sur des données synthétiques et réelles
        - Comparer les résultats avec la littérature scientifique
        - Documenter les performances et limites

        ### Documentation & Open-Source
        - Rédiger la documentation technique des nouvelles fonctionnalités
        - Créer des tutoriels et exemples d'utilisation
        - Contribuer à la documentation API
        - Participer aux revues de code et aux issues GitHub

        ### Recherche Appliquée
        - Explorer la littérature sur les métriques de synchronie inter-cerveau
        - Adapter des méthodes issues d'autres domaines (théorie de l'information, algèbre géométrique)
        - Collaborer avec les chercheurs pour tester les outils sur des données cliniques
        
        ### Projets concrets
        - Développement de métriques basées sur la théorie de l'information et l'algèbre géométrique
        - Dashboard de visualisation des résultats de synchronie
        - Application sur les études pilotes en cours au laboratoire

        **Impact**
        Vos contributions alimenteront directement les études cliniques du laboratoire sur les dynamiques
        inter-cérébrales et seront partagées avec une communauté grandissante de chercheuses et chercheurs
        en neurosciences sociales.
      en: |
        ## Your Mission
        **HyPyP** is the reference Python library for analyzing inter-brain synchrony in hyperscanning. Your mission:
        extend the analysis capabilities of synchronization dynamics by developing new metrics and
        visualization tools.
        
        **What you will do:**
        
        ### Development
        - Implement new synchrony metrics
        - Create interactive visualization modules
        - Optimize existing pipeline performance
        - Ensure robust code with tests and method benchmarks
        
        ### Validation & Testing
        - Write unit and integration tests
        - Validate metrics on synthetic and real data
        - Compare results with scientific literature
        - Document performance and limitations
        
        ### Documentation & Open-Source
        - Write technical documentation for new features
        - Create tutorials and usage examples
        - Contribute to API documentation
        - Participate in code reviews and GitHub issues
        
        ### Applied Research
        - Explore literature on inter-brain synchrony metrics
        - Adapt methods from other fields (information theory, geometric algebra)
        - Collaborate with researchers to test tools on clinical data
        
        ### Concrete Projects
        - Development of metrics based on information theory and geometric algebra
        - Dashboard for visualizing synchrony results
        - Application on ongoing pilot studies in the laboratory
        
        **Impact**
        Your contributions will directly feed into the laboratory's clinical studies on inter-brain dynamics and will be
        shared with a growing community of researchers in social neuroscience.

    profile:
      fr: |
        ## Profil Recherché
        **Ce qui vous anime**

        Vous êtes attiré·e par l'**exécution concrète, robuste, durable.**
        - **Orientation résultats** — Vous trouvez satisfaction dans le travail qui aboutit, les objectifs atteints, la
        documentation qui éclaire. La finition d'un travail bien fait vous anime.
        - **Curiosité intellectuelle** — Vous voulez comprendre pourquoi on mène ces projets, comment ils
        s'inscrivent dans la recherche, à quoi ils serviront. Vous lisez, vous posez des questions, vous
        explorez au-delà de votre mission immédiate.
        - **Rigueur méthodologique** — Vous travaillez de façon structurée, documentez vos démarches,
        validez vos résultats. Vous accordez du temps à bien faire les choses.
        - **Esprit collaboratif** — Vous appréciez les retours, partagez vos réflexions, accueillez les feedbacks.
        Vous contribuez à une dynamique d'équipe constructive.
        - **Autonomie et collaboration** — Face à un problème, vous décomposez, explorez la documentation,
        testez des hypothèses. Vous naviguez naturellement entre travail autonome et co-construction.

        **Compétences techniques fondamentales**

        ### Python & écosystème scientifique
        - Maîtrise de Python
        - Expérience avec NumPy/SciPy/Pandas
        - Familiarité avec les environnements virtuels et gestionnaires de paquets

        ### Qualité logicielle
        - Expérience avec Git
        - Écriture de tests (pytest)
        - Documentation de code

        ### Traitement du signal / neurosciences
        - Notions de traitement du signal
        - Intérêt pour les données EEG/physiologiques
        
        **Élément vérifiable obligatoire**
        - GitHub actif avec projets personnels ou contributions open-source
        
        **Atouts valorisés (non-obligatoires)**
        - Expérience avec MNE-Python ou autres librairies de neurosciences
        - Connaissances en théorie de l'information ou algèbre géométrique
        - Contributions antérieures à des projets open-source
        - Expérience en visualisation de données (Matplotlib, Plotly, Dash...)
        - Familiarité avec les standards BIDS
        - Intérêt pour les neurosciences sociales ou la psychiatrie
        - Publications ou présentations scientifiques

        ### Comment nous grandissons ensemble
        Ce stage est un espace de développement mutuel. Vous apporterez vos compétences et votre
        perspective, nous partagerons notre expertise scientifique et méthodologique. À travers la collaboration
        quotidienne, les revues de travail, les discussions et le mentorat, chacun·e développe les compétences
        qui font avancer le projet.
      en: |
        ## Desired Profile
        **What drives you**
        
        You are drawn to **concrete, robust, lasting execution.**
        - **Results-oriented** — You find satisfaction in work that delivers, goals achieved, documentation that
        clarifies. The completion of work well done motivates you.
        - **Intellectual curiosity** — You want to understand why we pursue these projects, how they fit into
        research, what they will serve. You read, ask questions, explore beyond your immediate mission.
        - **Methodological rigor** — You work in a structured way, document your approaches, validate your
        results. You take time to do things properly.
        - **Collaborative spirit** — You appreciate feedback, share your reflections, welcome input. You
        contribute to a constructive team dynamic.
        - **Autonomy and collaboration** — Faced with a problem, you break it down, explore documentation,
        test hypotheses. You navigate naturally between autonomous work and co-construction.
        
        **Core Technical Skills**
        
        ### Python & scientific ecosystem
        - Python proficiency
        - Experience with NumPy/SciPy/Pandas
        - Familiarity with virtual environments and package managers
        
        ### Software quality
        - Experience with Git
        - Test writing (pytest)
        - Code documentation
        
        ### Signal processing / neuroscience
        - Signal processing fundamentals
        - Interest in EEG/physiological data
        
